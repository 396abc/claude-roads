services:
  - type: web
    name: slowroads-mp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: WORLD
        value: A2-6e7ef869
      - key: ADMIN_KEY
        generateValue: true
